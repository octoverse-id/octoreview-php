name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job name below is a final required check in the `main: require PR + green CI` ruleset
# (.github/rulesets/main-require-pr-green-ci.json). `make release-check` runs the same gates.

jobs:
  static:
    runs-on: ubuntu-latest
    # Explicit timeouts everywhere: the default is 360 minutes and every job here is required.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint GitHub Actions workflows
        # Pinned actionlint via `go install` (checksum-verified by the Go module database).
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color
      - name: Check llms.txt links
        run: make llms-check
      - name: Prove the release scripts (version-check, check-release-merge, release-notes)
        run: make release-tooling-check
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2
      - name: Validate composer.json
        run: make validate
      - name: Install dependencies
        run: make install
      - name: Coding style (php-cs-fixer)
        run: make cs
      - name: Static analysis (PHPStan level 8)
        run: make stan

  test:
    name: test (${{ matrix.php-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: make install
      - name: Unit tests
        run: make test
      - name: Unit tests and the contract gate with the lowest allowed dependencies
        # The floor PHP with every dependency at the lowest version composer.json allows
        # (psr/http-message 1.1, Guzzle 7.8): catches an API used beyond a declared constraint.
        if: matrix.php-version == '8.2'
        run: |
          composer update --prefer-lowest --no-interaction --no-progress
          vendor/bin/phpunit
          vendor/bin/phpunit --group contract

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: make install
      - name: Contract gate (offline, against testdata/contract)
        run: make contract

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: make install
      - name: Quickstart and the integration suite against the pinned server image
        # SERVER_IMAGE in the Makefile names a published sha-<commit> of the server's main branch
        # (docs/versioning.md); the weekly contract-drift workflow also runs against :edge.
        run: make integration
