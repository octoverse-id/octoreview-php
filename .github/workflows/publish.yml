name: Publish

# Publishes a release of octoreview-php (docs/release.md). Packagist publishes from the
# repository's GitHub webhook when the tag is pushed; nothing is uploaded from here. This
# workflow proves the tag names the release merge, waits until Packagist lists the version, and
# creates the GitHub release from the CHANGELOG section. The gates mirror the server's
# publish-image.yml.
#
# workflow_dispatch from main rehearses it (docs/release.md, "Rehearsing a release"): every gate
# except the two only a release commit can pass, and nothing is published.

on:
  push:
    # Exact vX.Y.Z and vX.Y.Z-rc.N; any other tag shape is not a release.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  workflow_dispatch:

# No workflow-level permissions: the job asks for exactly what it needs.
permissions: {}

# One group for every release, never cancelled: a cancelled run would leave a tag without its
# GitHub release, and two releases racing would publish their releases out of order.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub release
      actions: read # read CI's conclusion for the tagged commit
    steps:
      - name: Reject a rehearsal from any ref but main
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::rehearse from main, not $REF"
            exit 1
          fi

      - name: Require a green commit on main
        # Before the checkout: nothing from the tagged tree runs until the commit is vetted.
        # Ancestry proves the code went through main (and so through review); a successful CI
        # push run on main proves that exact commit is green. event=push&branch=main matters:
        # a pull_request run for the same head sha built GitHub's merge ref, not this tree.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq '.status')
          case "$status" in
            behind | identical) ;;
            *)
              echo "::error::$GITHUB_SHA is not on main (compare status: $status); release tags go on merged commits"
              exit 1
              ;;
          esac
          green=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success&event=push&branch=main" \
            --jq '.total_count')
          if [ "${green:-0}" -lt 1 ]; then
            echo "::error::no successful CI run on main for $GITHUB_SHA; tag the merge commit after its CI passes"
            exit 1
          fi
          echo "$GITHUB_SHA is on main ($status) with $green successful CI run(s) on main"

      - name: Check out the commit being published
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # check-release-merge.sh reads the first parent

      - name: Resolve the version
        id: params
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            version=${GITHUB_REF_NAME#v}
            notes=$version
          else
            version=$(sed -nE "s/^ *public const VERSION = '([^']+)';\$/\1/p" src/Version.php | head -n1)
            # A rehearsal extracts [Unreleased], or right after a release (when it is empty) the
            # newest released section.
            notes=Unreleased
            if ! ./scripts/release-notes.sh Unreleased >/dev/null 2>&1; then
              notes=$(sed -nE 's/^## \[([0-9][^]]*)\] - .*/\1/p' CHANGELOG.md | head -n1)
            fi
          fi
          prerelease=false
          [[ $version == *-rc.* ]] && prerelease=true
          {
            echo "version=$version"
            echo "notes=$notes"
            echo "prerelease=$prerelease"
          } >>"$GITHUB_OUTPUT"
          echo "version $version (notes: $notes, prerelease: $prerelease, event: $EVENT)"

      - name: Assert the version stamps name the tag
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.params.outputs.version }}
        run: ./scripts/version-check.sh "$VERSION"

      - name: Assert the tag names the release merge, not a later commit
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.params.outputs.version }}
        run: ./scripts/check-release-merge.sh "$VERSION" "$GITHUB_SHA"

      - name: Extract the release notes
        env:
          NOTES: ${{ steps.params.outputs.notes }}
        run: |
          set -euo pipefail
          ./scripts/release-notes.sh "$NOTES" | tee "$RUNNER_TEMP/notes.md"

      - name: Check that Packagist knows the package
        # A rehearsal cannot wait for a version, but it can prove the package is registered and
        # still follows main.
        if: github.event_name == 'workflow_dispatch'
        env:
          PACKAGE: octoverse-id/octoreview-php
        run: |
          set -euo pipefail
          curl -fsS "https://repo.packagist.org/p2/$PACKAGE~dev.json" |
            jq -e --arg p "$PACKAGE" '.packages[$p] | map(.version) | index("dev-main") != null'

      - name: Wait until Packagist lists the tag
        # The webhook usually lands within a minute. Ten minutes without the version means the
        # hook did not fire: docs/release.md says how to trigger the update by hand.
        if: github.event_name == 'push'
        env:
          PACKAGE: octoverse-id/octoreview-php
          VERSION: ${{ steps.params.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if curl -fsS "https://repo.packagist.org/p2/$PACKAGE.json" |
              jq -e --arg p "$PACKAGE" --arg v "$VERSION" \
                '.packages[$p] | map(.version) | index("v" + $v) != null or index($v) != null' >/dev/null; then
              echo "Packagist lists $PACKAGE $VERSION"
              exit 0
            fi
            echo "attempt $attempt: Packagist does not list $PACKAGE $VERSION yet"
            sleep 30
          done
          echo "::error::Packagist did not list $PACKAGE $VERSION within ten minutes"
          exit 1

      - name: Create the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.params.outputs.version }}
          PRERELEASE: ${{ steps.params.outputs.prerelease }}
        run: |
          set -euo pipefail
          # A re-run after the release was created finds it and stops here.
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "the GitHub release v$VERSION already exists"
            exit 0
          fi
          flags=(--verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md")
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "v$VERSION" "${flags[@]}"
